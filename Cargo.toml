[package]
name = "a2ltool"
version = "1.0.0"
authors = ["Wanghaitao <wht_0117@163.com>"]
edition = "2024"
description = "A tool to edit, merge, update and generate A2L (ASAP2) files"
license = "MIT OR Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
a2lfile = "3.4.0"
object = { version = "0.38", default-features = false, features = ["read"] }
gimli = { version = "0.33", default-features = false, features = ["read"] }
memmap2 = "0.9"
clap = { version = "4.5", features = ["wrap_help"]}
cpp_demangle = "0.5.0"
regex = "1"
indexmap = "2.8.0"
fnv = "1.0.7"
argfile = { version ="1.0", features=["response"]}
pdb2 = "0.10"
memchr = "2.7.5"
num-traits = "0.2.19"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
glob = "0.3.3"

[dev-dependencies]
tempfile = "3.19"

[profile.release]
panic = "abort"
strip = "debuginfo"
lto = "fat"
